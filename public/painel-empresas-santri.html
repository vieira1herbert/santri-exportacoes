    (() =&gt; {
      const root = document.getElementById('santri-company-manager');
      const tabs = [...root.querySelectorAll('.company-tab')];
      const views = [...root.querySelectorAll('.company-view')];
      const editor = root.querySelector('#editor-company');
      const editorTitle = root.querySelector('#editor-title');
      const reportName = root.querySelector('#report-name');
      const destination = root.querySelector('#destination-path');
      const progressCard = root.querySelector('#progress-company');
      const progressTitle = root.querySelector('#progress-title');
      const progressDetail = root.querySelector('#progress-detail');
      const progressValue = root.querySelector('#progress-value');
      const progressBar = root.querySelector('#progress-bar');
      let timer;

      function selectCompany(company) {
        tabs.forEach(tab =&gt; {
          const selected = tab.dataset.company === company;
          tab.setAttribute('aria-selected', String(selected));
          tab.classList.toggle('is-selected', selected);
        });
        views.forEach(view =&gt; {
          view.hidden = view.id !== 'view-' + company;
        });
        editor.classList.remove('open');
        progressCard.classList.remove('visible');
      }

      function openEditor(company, name) {
        editorTitle.textContent = (name ? 'Editar exportação' : 'Nova exportação') + ' — ' + company;
        reportName.value = name || 'Nova exportação';
        destination.value = 'C:\\Exportacoes\\Santri\\' + (company.startsWith('SOL') ? 'SOL' : 'HORUS') + '\\{relatorio}\\{data}.xlsx';
        editor.classList.add('open');
      }

      function run(company, label, count) {
        clearInterval(timer);
        let value = 0;
        const stages = [
          'Abrindo exclusivamente o aplicativo da ' + company + '...',
          'Realizando o login da ' + company + '...',
          'Navegando e preenchendo os filtros...',
          'Exportando para a pasta da ' + company + '...',
          'Validando os arquivos gerados...'
        ];
        progressTitle.textContent = label;
        progressDetail.textContent = stages[0];
        progressValue.textContent = '0%';
        progressBar.style.width = '0%';
        progressCard.classList.add('visible');
        timer = setInterval(() =&gt; {
          value += 10;
          progressValue.textContent = value + '%';
          progressBar.style.width = value + '%';
          progressDetail.textContent = value &gt;= 100 ? count + ' exportação(ões) da ' + company + ' concluída(s).' : stages[Math.min(4, Math.floor(value / 22))];
          if (value &gt;= 100) {
            clearInterval(timer);
            progressTitle.textContent = 'Execução da ' + company + ' concluída';
          }
        }, 260);
      }

      tabs.forEach(tab =&gt; tab.addEventListener('click', () =&gt; selectCompany(tab.dataset.company)));
      root.querySelectorAll('.new-report').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; openEditor(button.dataset.company, ''));
      });
      root.querySelectorAll('.edit-report').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const name = button.closest('tr').querySelector('.report strong').textContent;
          openEditor(button.dataset.company, name);
        });
      });
      root.querySelectorAll('.run-one').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const name = button.closest('tr').querySelector('.report strong').textContent;
          run(button.dataset.company, 'Executando “' + name + '”', 1);
        });
      });
      root.querySelectorAll('.run-batch').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const table = root.querySelector('#' + button.dataset.table);
          const count = [...table.querySelectorAll('tbody input[type=&quot;checkbox&quot;]')].filter(input =&gt; input.checked).length;
          run(button.dataset.company, 'Executando lote da ' + button.dataset.company, count);
        });
      });
      root.querySelector('#cancel-editor-company').addEventListener('click', () =&gt; editor.classList.remove('open'));
      root.querySelector('#save-editor-company').addEventListener('click', () =&gt; editor.classList.remove('open'));
    })();

      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
