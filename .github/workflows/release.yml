name: Release Windows

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Canal da release
        required: true
        default: stable
        type: choice
        options: [stable, test]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -e ".[build]" pip-audit
      - name: Validar projeto
        run: python -m unittest discover -s tests -v
      - name: Auditar dependências
        run: python -m pip_audit --strict .
      - name: Gerar executável
        run: python build_app.py
      - name: Instalar compilador do instalador
        run: choco install innosetup --no-progress -y
      - name: Gerar instalador corporativo
        run: python build_installer.py
      - uses: actions/upload-artifact@v7
        with:
          name: santri-exportacoes-release
          path: |
            dist/Santri Exportações.exe
            dist/Santri-Exportacoes-Setup-*.exe
            dist/santri-exportacoes-release.json
            dist/santri-exportacoes-sbom.cdx.json
