name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e . pip-audit

      - name: Auditar dependências
        run: python -m pip_audit --strict .

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Validar compilação Python
        run: python -m compileall -q src tests run_local_app.py

  build:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de compilação
        run: python -m pip install -e ".[build]"

      - name: Gerar executável Windows
        run: python build_app.py

      - uses: actions/upload-artifact@v7
        with:
          name: santri-exportacoes-windows
          path: |
            dist/Santri Exportações.exe
            dist/santri-exportacoes-sbom.cdx.json
            dist/santri-exportacoes-release.json
          if-no-files-found: error
