name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e .

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Validar compilação Python
        run: python -m compileall -q src tests run_local_app.py

  build:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências de compilação
        run: python -m pip install -e ".[build]"

      - name: Gerar executável Windows
        shell: powershell
        run: .\scripts\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: santri-exportacoes-windows
          path: dist/Santri Exportações.exe
          if-no-files-found: error
