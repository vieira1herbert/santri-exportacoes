[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "santri-exportacoes"
version = "2.2.1"
description = "Aplicativo Windows para gerenciar exportações do Santri ERP."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Herbert Vieira" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "pywebview==6.2.1",
  "pywinauto==0.6.9",
  "pillow==12.3.0",
  "pywin32==312; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.22.0",
]
quality = [
  "black==26.5.1",
  "radon==6.0.1",
  "ruff==0.16.4",
]

[project.gui-scripts]
santri-exportacoes = "santri_automation.desktop_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
santri_automation = [
  "resources/config/*.json",
  "resources/config/*.md",
  "resources/ui/*.html",
  "resources/ui/styles/*.css",
  "resources/ui/scripts/*.js",
  "resources/ui/scripts/core/*.js",
  "resources/ui/scripts/shared/*.js",
  "resources/ui/scripts/features/history/*.js",
  "resources/ui/scripts/features/monitoring/*.js",
  "resources/ui/scripts/features/scheduling/*.js",
  "resources/ui/scripts/features/releases/*.js",
  "resources/ui/scripts/features/platform/*.js",
  "resources/ui/scripts/features/workflows/*.js",
  "resources/ui/assets/*",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["E402"]
